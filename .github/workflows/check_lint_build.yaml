on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

name: Check, Lint, Build

env:
  CARGO_TERM_COLOR: always

jobs:
  check-lint:
    name: Check, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: false
          shared-key: x86_64-unknown-linux-gnu

      - name: Rustfmt
        run: cargo fmt --all -- --check
      
      - name: Cargo check
        run: cargo check --all-targets --all-features
      
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      
      - name: Deny
        uses: EmbarkStudios/cargo-deny-action@v2
  
  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [check-lint]
    steps:
      - name: Download latest bitcoin-patched
        run: |
          pushd ..
          wget https://releases.drivechain.info/L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          unzip L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          rm L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          mv L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu bitcoin-patched-bins
          chmod +x bitcoin-patched-bins/bitcoind
          chmod +x bitcoin-patched-bins/bitcoin-cli
          popd
      - name: Download latest electrs
        run: |
          pushd ..
          wget https://releases.drivechain.info/electrs-latest-x86_64-unknown-linux-gnu.zip
          unzip electrs-latest-x86_64-unknown-linux-gnu.zip
          rm electrs-latest-x86_64-unknown-linux-gnu.zip
          mv electrs-latest-x86_64-unknown-linux-gnu electrs
          chmod +x electrs
          popd
      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: x86_64-pc-windows-gnu
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: false
          shared-key: x86_64-unknown-linux-gnu
      - name: Build the matched enforcer
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ENFORCER_SOURCE: ${{ runner.temp }}/bip300301-enforcer
        run: |
          ENFORCER_REV=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["dependencies"]["bip300301_enforcer_integration_tests"]["rev"])')
          git init "$ENFORCER_SOURCE"
          git -C "$ENFORCER_SOURCE" fetch --depth 1 https://github.com/LayerTwo-Labs/bip300301_enforcer "$ENFORCER_REV"
          git -C "$ENFORCER_SOURCE" checkout --detach FETCH_HEAD
          cargo build --locked --manifest-path "$ENFORCER_SOURCE/Cargo.toml" --bin bip300301_enforcer
      - name: Build (debug)
        run: cargo build
      - name: Run integration tests
        id: runIntegrationTests
        run: |
          export BIP300301_ENFORCER='target/debug/bip300301_enforcer'
          export BITCOIND='../bitcoin-patched-bins/bitcoind'
          export BITCOIN_CLI='../bitcoin-patched-bins/bitcoin-cli'
          export ELECTRS='../electrs'
          export TRUTHCOIN_APP='target/debug/truthcoin_dc_app'
          cargo run --example integration_tests

  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            binary-suffix: ""
            rustflags: ""
          - os: macos-latest
            name: x86_64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: macos-latest
            name: aarch64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: ubuntu-latest
            name: x86_64-pc-windows-gnu
            binary-suffix: .exe
            rustflags: "-C linker=/usr/bin/x86_64-w64-mingw32-gcc"
    name: Build, Release ((${{ matrix.name }}))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: ${{ matrix.name }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-bin: false
          key: ${{ matrix.name }}

      - name: Install windows-specific deps
        run: sudo apt install mingw-w64
        if: ${{ matrix.name == 'x86_64-pc-windows-gnu' }}

      - name: Build
        run: cargo build --release --target ${{ matrix.name }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: 'Set environment variables: version number and output filenames'
        run: |
          TRUTHCOIN_APP_VERSION=$(cargo metadata --format-version 1 | \
            jq -er '.packages | map(select(.name == "truthcoin_dc_app") | .version) | .[0]')
          TRUTHCOIN_APP_FILENAME="truthcoin-${TRUTHCOIN_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          TRUTHCOIN_CLI_FILENAME="truthcoin-cli-${TRUTHCOIN_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          TRUTHCOIN_ARCHIVE_FILENAME="truthcoin-${TRUTHCOIN_APP_VERSION}-${{ matrix.name }}.zip"
          echo "TRUTHCOIN_APP_VERSION=$TRUTHCOIN_APP_VERSION" >> "$GITHUB_ENV"
          echo "TRUTHCOIN_APP_FILENAME=$TRUTHCOIN_APP_FILENAME" >> "$GITHUB_ENV"
          echo "TRUTHCOIN_CLI_FILENAME=$TRUTHCOIN_CLI_FILENAME" >> "$GITHUB_ENV"
          echo "TRUTHCOIN_ARCHIVE_FILENAME=$TRUTHCOIN_ARCHIVE_FILENAME" >> "$GITHUB_ENV"

      - name: 'Set filenames for release binaries'
        run: |
          pushd "target/${{ matrix.name }}/release/"
          ln -fs "truthcoin_dc_app${{ matrix.binary-suffix }}" "${TRUTHCOIN_APP_FILENAME}"
          ln -fs "truthcoin_dc_app_cli${{ matrix.binary-suffix }}" "${TRUTHCOIN_CLI_FILENAME}"
          popd

      - name: Package release binaries
        run: |
          cd "target/${{ matrix.name }}/release"
          mkdir -p package
          cp "truthcoin_dc_app${{ matrix.binary-suffix }}" "package/truthcoin${{ matrix.binary-suffix }}"
          cp "truthcoin_dc_app_cli${{ matrix.binary-suffix }}" "package/truthcoin-cli${{ matrix.binary-suffix }}"
          cd package
          zip "../${TRUTHCOIN_ARCHIVE_FILENAME}" "truthcoin${{ matrix.binary-suffix }}" "truthcoin-cli${{ matrix.binary-suffix }}"

      - name: 'Upload Artifacts (truthcoin)'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TRUTHCOIN_APP_FILENAME }}
          if-no-files-found: error
          path: |
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_APP_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_CLI_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_ARCHIVE_FILENAME }}

      - name: Release
        uses: softprops/action-gh-release@v2.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_APP_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_CLI_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_ARCHIVE_FILENAME }}
          fail_on_unmatched_files: true

  upload-releases-to-releases-drivechain-info:
    name: Upload releases to releases.drivechain.info
    runs-on: ubuntu-latest
    needs: [build-release, integration-test]
    if: startsWith(github.ref, 'refs/tags/') && vars.ENABLE_RELEASE_MIRROR == 'true'
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          tag: ${{ github.ref_name }}

      - name: Create zip files for releases.drivechain.info
        run: |
          shopt -s extglob
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-x86_64-apple-darwin truthcoin-latest-x86_64-apple-darwin
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-apple-darwin truthcoin-cli-latest-x86_64-apple-darwin
          zip L2-S13-Truthcoin-latest-x86_64-apple-darwin.zip \
            truthcoin-latest-x86_64-apple-darwin \
            truthcoin-cli-latest-x86_64-apple-darwin
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-aarch64-apple-darwin truthcoin-latest-aarch64-apple-darwin
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-aarch64-apple-darwin truthcoin-cli-latest-aarch64-apple-darwin
          zip L2-S13-Truthcoin-latest-aarch64-apple-darwin.zip \
            truthcoin-latest-aarch64-apple-darwin \
            truthcoin-cli-latest-aarch64-apple-darwin
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-x86_64-pc-windows-gnu.exe truthcoin-latest-x86_64-pc-windows-gnu.exe
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-pc-windows-gnu.exe truthcoin-cli-latest-x86_64-pc-windows-gnu.exe
          zip L2-S13-Truthcoin-latest-x86_64-pc-windows-gnu.zip \
            truthcoin-latest-x86_64-pc-windows-gnu.exe \
            truthcoin-cli-latest-x86_64-pc-windows-gnu.exe
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-x86_64-unknown-linux-gnu truthcoin-latest-x86_64-unknown-linux-gnu
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-unknown-linux-gnu truthcoin-cli-latest-x86_64-unknown-linux-gnu
          zip L2-S13-Truthcoin-latest-x86_64-unknown-linux-gnu.zip \
            truthcoin-latest-x86_64-unknown-linux-gnu \
            truthcoin-cli-latest-x86_64-unknown-linux-gnu

      - name: Upload release assets to releases.drivechain.info
        uses: appleboy/scp-action@v1
        with:
          host: 45.33.96.47
          username: root
          password: ${{ secrets.RELEASES_SERVER_PW }}
          port: 22
          source: 'L2-S13-Truthcoin-latest-*.zip'
          target: '/var/www/html/'
